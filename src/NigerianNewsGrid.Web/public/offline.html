<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline Mode | News Stand NG</title>
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <meta name="theme-color" content="#008751" />
    <style>
      :root {
        --bg-primary: #0b0f17;
        --bg-card: rgba(18, 24, 38, 0.9);
        --text-primary: #f8fafc;
        --text-muted: #94a3b8;
        --accent-emerald: #008751;
        --accent-emerald-hover: #00a865;
        --border-color: rgba(255, 255, 255, 0.08);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: var(--bg-primary);
        color: var(--text-primary);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .offline-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 40px 28px;
        max-width: 480px;
        width: 100%;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(12px);
      }
      .offline-icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        background: rgba(0, 135, 81, 0.15);
        border: 1px solid rgba(0, 135, 81, 0.3);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 12px;
        letter-spacing: -0.02em;
      }
      p {
        color: var(--text-muted);
        font-size: 0.95rem;
        line-height: 1.6;
        margin-bottom: 24px;
      }
      .offline-actions {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .btn {
        padding: 12px 20px;
        border-radius: 10px;
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
        transition: all 0.2s ease;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .btn-primary {
        background: var(--accent-emerald);
        color: #ffffff;
        border: none;
      }
      .btn-primary:hover {
        background: var(--accent-emerald-hover);
        transform: translateY(-1px);
      }
      .btn-secondary {
        background: rgba(255, 255, 255, 0.05);
        color: var(--text-primary);
        border: 1px solid var(--border-color);
      }
      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      .saved-count {
        margin-top: 20px;
        font-size: 0.85rem;
        color: var(--accent-emerald);
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="offline-card">
      <div class="offline-icon">📡</div>
      <h1>No Internet Connection</h1>
      <p>
        You are currently offline. Don't worry — your installed News Stand NG app keeps previously opened headlines and bookmarks saved on your device.
      </p>

      <div class="offline-actions">
        <button class="btn btn-primary" onclick="window.location.reload()">
          🔄 Try Reconnecting
        </button>
        <a href="/" class="btn btn-secondary">
          📰 Return to Cached Home
        </a>
      </div>

      <div id="saved-notice" class="saved-count" style="display: none;"></div>
    </div>

    <script>
      try {
        const bookmarks = JSON.parse(localStorage.getItem('newsstand_bookmarked_ids') || '[]');
        if (bookmarks.length > 0) {
          const notice = document.getElementById('saved-notice');
          notice.textContent = `✓ You have ${bookmarks.length} saved story ${bookmarks.length === 1 ? 'bookmark' : 'bookmarks'} on this device.`;
          notice.style.display = 'block';
        }
      } catch (e) {}

      window.addEventListener('online', () => {
        window.location.reload();
      });
    </script>
  </body>
</html>
