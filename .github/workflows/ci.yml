name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
      - name: Restore dependencies
        run: |
          dotnet restore src/NewsApi/NewsApi.csproj
          dotnet restore src/AdminDashboard/AdminDashboard.csproj
          dotnet restore src/NewsScraperService/NewsScraperService.csproj
          dotnet restore src/TtsWorker/TtsWorker.csproj
          dotnet restore tests/NewsApiClient.Tests/NewsApiClient.Tests.csproj
          dotnet restore tests/NewsApi.Tests/NewsApi.Tests.csproj
      - name: Build NewsApi
        run: dotnet build src/NewsApi/NewsApi.csproj -c Release --no-restore
      - name: Build AdminDashboard
        run: dotnet build src/AdminDashboard/AdminDashboard.csproj -c Release --no-restore
      - name: Build NewsScraperService
        run: dotnet build src/NewsScraperService/NewsScraperService.csproj -c Release --no-restore
      - name: Build TtsWorker
        run: dotnet build src/TtsWorker/TtsWorker.csproj -c Release --no-restore
      - name: Build Tests
        run: |
          dotnet build tests/NewsApiClient.Tests/NewsApiClient.Tests.csproj -c Release --no-restore
          dotnet build tests/NewsApi.Tests/NewsApi.Tests.csproj -c Release --no-restore
      - name: Run Unit Tests
        run: |
          dotnet test tests/NewsApiClient.Tests/NewsApiClient.Tests.csproj -c Release --no-build --verbosity normal
          dotnet test tests/NewsApi.Tests/NewsApi.Tests.csproj -c Release --no-build --verbosity normal
      - name: Setup Node.js for Web SSR Build
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/NigerianNewsGrid.Web/package-lock.json
      - name: Build NigerianNewsGrid.Web (SSR)
        working-directory: src/NigerianNewsGrid.Web
        run: |
          npm ci
          npm run build
      - name: Verify Docker Compose Build
        run: |
          mkdir -p secrets
          touch secrets/gcp-service-account.json
          docker compose build
        env:
          POSTGRES_PASSWORD: ci_test_password
          API_KEY: ci_test_api_key
