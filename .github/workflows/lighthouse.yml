name: Lighthouse CI (Core Web Vitals & SEO)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lighthouse:
    name: Lighthouse Audit & Core Web Vitals Budget
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: src/NigerianNewsGrid.Web/package-lock.json

      - name: Install Web Dependencies
        working-directory: src/NigerianNewsGrid.Web
        run: npm ci

      - name: Build React Router SSR Web Application
        working-directory: src/NigerianNewsGrid.Web
        run: npm run build

      - name: Run Lighthouse CI with Core Web Vitals Budgets
        run: |
          node src/NigerianNewsGrid.Web/scripts/lhci-mock-api.mjs > /tmp/mock-api.log 2>&1 &
          MOCK_PID=$!
          trap 'kill $MOCK_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:5055/api/v1/articles > /dev/null; then
              echo "Mock NewsApi ready on http://127.0.0.1:5055 (PID $MOCK_PID)"
              break
            fi
            sleep 0.5
          done

          curl -sf http://127.0.0.1:5055/api/v1/articles > /dev/null || {
            echo "Mock API failed to start"
            cat /tmp/mock-api.log
            exit 1
          }

          npx -y @lhci/cli@0.14.x autorun --config=./lighthouserc.json
        env:
          MOCK_API_PORT: 5055
          PORT: 3000
          API_BASE_URL: http://127.0.0.1:5055
          NEWS_API_URL: http://127.0.0.1:5055
