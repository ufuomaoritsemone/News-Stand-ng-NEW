name: Lighthouse CI (Core Web Vitals & SEO)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lighthouse:
    name: Lighthouse Audit & Core Web Vitals Budget
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: src/NigerianNewsGrid.Web/package-lock.json

      - name: Install Web Dependencies
        working-directory: src/NigerianNewsGrid.Web
        run: npm ci

      - name: Build React Router SSR Web Application
        working-directory: src/NigerianNewsGrid.Web
        run: npm run build

      - name: Start Mock NewsApi (deterministic SSR data)
        working-directory: src/NigerianNewsGrid.Web
        run: |
          nohup node scripts/lhci-mock-api.mjs > mock-api.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:5055/api/v1/articles > /dev/null && exit 0
            sleep 0.5
          done
          echo "Mock API failed to start"; cat mock-api.log; exit 1
        env:
          MOCK_API_PORT: 5055

      - name: Warm up SSR server
        run: |
          npm --prefix src/NigerianNewsGrid.Web start > /tmp/warmup.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/ > /dev/null && break
            sleep 1
          done
          kill $SERVER_PID || true
          sleep 1
        env:
          PORT: 3000
          API_BASE_URL: http://127.0.0.1:5055

      - name: Run Lighthouse CI with Core Web Vitals Budgets
        run: |
          npx -y @lhci/cli@0.14.x autorun --config=./lighthouserc.json
        env:
          PORT: 3000
          API_BASE_URL: http://127.0.0.1:5055
