services:
  postgres:
    image: postgres:16-alpine
    container_name: nigeriannewsgrid-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-newsgrid}
      - POSTGRES_USER=${POSTGRES_USER:-newsuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-newsuser} -d $${POSTGRES_DB:-newsgrid}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  news-api:
    image: nigeriannewsgrid-newsapi:latest
    container_name: nigeriannewsgrid-newsapi
    build:
      context: .
      dockerfile: src/NewsApi/Dockerfile
    ports:
      - "127.0.0.1:5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__NewsDb=Host=postgres;Port=5432;Database=${POSTGRES_DB:-newsgrid};Username=${POSTGRES_USER:-newsuser};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - DbProvider=postgres
      - ApiKey=${API_KEY:?Set API_KEY in .env}
      - YouTube__ApiKey=${YOUTUBE_API_KEY:-}
      - Gemini__ApiKey=${GEMINI_API_KEY:-}
      - Gemini__Model=${GEMINI_MODEL:-gemini-3.1-flash-lite}
      - AiEnrichment__GeminiEnabled=${AiEnrichment__GeminiEnabled:-true}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/secrets/gcp-service-account.json
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-project-00ae160d-e8ea-44ec-9ff}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-project-00ae160d-e8ea-44ec-9ff}
      - GCP_LOCATION=${GCP_LOCATION:-us-central1}
      - GOOGLE_GENAI_USE_VERTEXAI=${GOOGLE_GENAI_USE_VERTEXAI:-false}
      - GoogleCloud__ApiKey=${GCP_TTS_API_KEY:-}
      - IndexNow__Key=${INDEXNOW_KEY:-3a7b9c1d2e4f5a6b7c8d9e0f1a2b3c4d}
      - AllowedOrigins__0=${AllowedOrigins__0:-https://newsstand.ng}
      - AllowedOrigins__1=${AllowedOrigins__1:-https://www.newsstand.ng}
      - AllowedOrigins__2=${AllowedOrigins__2:-https://admin.newsstand.ng}
      - AllowedOrigins__3=${AllowedOrigins__3:-http://localhost:3000}
      - Google__ClientId=${GOOGLE_CLIENT_ID:-434931027697-0ofh3nptkv409vju55od3fhrfbkccu15.apps.googleusercontent.com}
      - Feedback__Smtp__Host=${SMTP_HOST:-}
      - Feedback__Smtp__Port=${SMTP_PORT:-587}
      - Feedback__Smtp__EnableSsl=${SMTP_ENABLE_SSL:-true}
      - Feedback__Smtp__UserName=${SMTP_USERNAME:-}
      - Feedback__Smtp__Password=${SMTP_PASSWORD:-}
      - Feedback__Smtp__FromEmail=${SMTP_FROM_EMAIL:-no-reply@newsstand.ng}
    volumes:
      - audio-data:/app/data/audio
      - img-cache:/app/data/img_cache
      - ai-logs:/app/logs
      - ./secrets:/app/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/healthz/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  admin-dashboard:
    image: nigeriannewsgrid-admindashboard:latest
    container_name: nigeriannewsgrid-admindashboard
    build:
      context: .
      dockerfile: src/AdminDashboard/Dockerfile
    ports:
      - "127.0.0.1:5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ApiBaseUrl=http://news-api:8080
      - NewsApi__BaseUrl=http://news-api:8080
      - ApiKey=${API_KEY:?Set API_KEY in .env}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-AdminPass123!}
    depends_on:
      news-api:
        condition: service_healthy
    restart: unless-stopped

  news-web:
    image: nigeriannewsgrid-web:latest
    container_name: nigeriannewsgrid-web
    build:
      context: src/NigerianNewsGrid.Web
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - API_BASE_URL=http://news-api:8080
      - NEWS_API_URL=http://news-api:8080
      - VITE_API_BASE=${VITE_API_BASE:-/api/v1}
      - INDEXNOW_KEY=${INDEXNOW_KEY:-3a7b9c1d2e4f5a6b7c8d9e0f1a2b3c4d}
    depends_on:
      news-api:
        condition: service_healthy
    restart: unless-stopped

  news-scraper-service:
    image: nigeriannewsgrid-newsscraperservice:latest
    container_name: nigeriannewsgrid-scraperservice
    build:
      context: .
      dockerfile: src/NewsScraperService/Dockerfile
    environment:
      - DOTNET_ENVIRONMENT=Production
      - ApiBaseUrl=http://news-api:8080
      - NewsApi__BaseUrl=http://news-api:8080
      - Scraper__IntervalMinutes=15
      - Scraper__MaxConcurrency=${SCRAPER_MAX_CONCURRENCY:-4}
      - ApiKey=${API_KEY:?Set API_KEY in .env}
      - Gemini__ApiKey=${GEMINI_API_KEY:-}
      - Gemini__Model=${GEMINI_MODEL:-gemini-3.1-flash-lite}
    depends_on:
      news-api:
        condition: service_healthy
    restart: unless-stopped

  tts-worker:
    image: nigeriannewsgrid-ttsworker:latest
    container_name: nigeriannewsgrid-ttsworker
    build:
      context: .
      dockerfile: src/TtsWorker/Dockerfile
    environment:
      - DOTNET_ENVIRONMENT=Production
      - ApiBaseUrl=http://news-api:8080
      - NewsApi__BaseUrl=http://news-api:8080
      - Tts__AudioStoragePath=/app/data/audio
      - GoogleCloud__ApiKey=${GCP_TTS_API_KEY:-}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/secrets/gcp-service-account.json
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-project-00ae160d-e8ea-44ec-9ff}
      - ApiKey=${API_KEY:?Set API_KEY in .env}
    volumes:
      - audio-data:/app/data/audio
      - ./secrets:/app/secrets:ro
    depends_on:
      news-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  audio-data:
  img-cache:
  ai-logs:

